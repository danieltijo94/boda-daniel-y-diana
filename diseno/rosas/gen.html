<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="0" height="0"><defs></defs></svg>
<script src="comun.js"></script><script src="rosas.js"></script><script src="sello2.js"></script>
<script>
const svg = document.getElementById("s");
addDefs(svg); addSelloDefs(svg);
const sym = (id, vb) => el(svg, "symbol", { id, viewBox: vb, overflow: "visible" });
const use = (g, href, x, y, w, h, extra = {}) => el(g, "use", Object.assign({ href: "#" + href, x, y, width: w, height: h }, extra));
// Rosas (mismos ids que las orquídeas para que todo el sitio cambie solo)
rosaReal(sym("orchid", "-50 -50 100 100"), 0, 4, 42, "marfil", 0);
rosaReal(sym("orchidBlush", "-50 -50 100 100"), 0, 4, 42, "rubor", 15);
rosaReal(sym("roseWine", "-50 -50 100 100"), 0, 4, 42, "vino", -10);
boton(sym("obud", "-10 -14 20 28"), 0, 12, 1.05, 0, "rubor");
hojaReal(sym("oleaf", "0 0 120 50"), 4, 26, 3.1, -6);
// Vara de rosas (antes vara de orquídeas): ramas, flores secas y rosas
{ const g = sym("spray", "0 0 320 190");
  pampa(g, 40, 170, 150, 70, 90, "#d8c8aa"); pampa(g, 60, 168, 260, 60, 80, "#dfd1b6");
  paniculata(g, 50, 160, 210, 70, 18, 16); paniculata(g, 60, 165, 290, 40, 14, 12);
  el(g, "path", { d: "M40 160C70 90 150 40 300 44", stroke: "#a19c82", "stroke-width": 2.2, fill: "none", "stroke-linecap": "round" });
  use(g, "oleaf", 10, 140, 80, 33); use(g, "oleaf", 30, 156, 66, 27, { transform: "rotate(-18 63 170)" });
  use(g, "oleaf", 158, 44, 48, 20, { transform: "rotate(-150 182 54)" });
  use(g, "orchid", 34, 82, 92, 92); use(g, "roseWine", 108, 46, 76, 76); use(g, "orchidBlush", 176, 28, 64, 64); use(g, "orchid", 236, 26, 44, 44);
  use(g, "obud", 280, 30, 14, 20, { transform: "rotate(70 287 40)" }); use(g, "obud", 296, 36, 10, 14, { transform: "rotate(80 301 43)" }); }
// Guirnalda centrada (separadores)
{ const g = sym("garland", "0 0 320 120");
  el(g, "path", { d: "M20 70C80 50 120 62 160 62S240 50 300 70", stroke: "url(#gGold)", "stroke-width": 1.4, fill: "none" });
  use(g, "oleaf", 66, 66, 44, 18, { transform: "rotate(170 88 75)" }); use(g, "oleaf", 210, 66, 44, 18, { transform: "rotate(10 232 75)" });
  use(g, "obud", 22, 58, 12, 18, { transform: "rotate(-70 28 67)" }); use(g, "obud", 286, 58, 12, 18, { transform: "rotate(70 292 67)" });
  use(g, "orchidBlush", 46, 44, 42, 42); use(g, "orchidBlush", 232, 44, 42, 42);
  use(g, "orchid", 86, 30, 58, 58); use(g, "orchid", 176, 30, 58, 58); use(g, "roseWine", 124, 12, 72, 72); }
// Variantes de rosa (solo para los ramos, para que no se vean todas iguales)
rosaReal(sym("roseIvory2", "-50 -50 100 100"), 0, 4, 42, "marfil", 35, .74);
rosaReal(sym("roseBlush2", "-50 -50 100 100"), 0, 4, 42, "rubor", -25, .7);
const R = (g, href, cx, cy, w, rot = 0) => use(g, href, cx - w / 2, cy - w / 2, w, w, rot ? { transform: `rotate(${rot} ${cx} ${cy})` } : {});
const H = (g, x, y, w, rot) => use(g, "oleaf", x, y - w * .21, w, w * .42, { transform: `rotate(${rot} ${x} ${y})` }); // hoja que nace en (x,y)
// Ramo grande (abajo a la izquierda de la portada y del sobre): rosas juntas como un ramo de verdad,
// hojas que asoman entre ellas y flores secas detrás, todo nace de la esquina
{ const g = sym("bouquet", "0 0 300 300");
  pampa(g, 10, 300, 18, 40, 140, "#d6c6a7"); pampa(g, 20, 300, 92, 46, 130, "#ddcfb4");
  pampa(g, 30, 300, 172, 96, 120, "#d2c09e"); pampa(g, 30, 300, 246, 160, 110, "#dccdb0"); pampa(g, 30, 300, 292, 236, 90, "#d8c8aa");
  rama(g, 6, 300, 52, 86, 8); rama(g, 30, 300, 270, 196, 8);
  paniculata(g, 30, 290, 56, 92, 22, 16); paniculata(g, 40, 290, 140, 96, 22, 16); paniculata(g, 40, 290, 226, 150, 20, 15); paniculata(g, 40, 296, 280, 268, 16, 12);
  // hojas detrás de las rosas (salen del centro del ramo hacia afuera)
  H(g, 70, 200, 78, -115); H(g, 100, 190, 74, -72); H(g, 140, 196, 80, -32); H(g, 170, 230, 76, -6);
  H(g, 60, 220, 70, -150); H(g, 190, 260, 64, 18); H(g, 40, 240, 62, 170);
  use(g, "obud", 54, 92, 20, 30, { transform: "rotate(-14 64 107)" });
  el(g, "path", { d: "M70 200 C66 160 64 130 64 116", stroke: "#9d9a80", "stroke-width": 1.4, fill: "none" });
  // rosas: atrás, medio y adelante (se tapan un poco unas a otras)
  R(g, "orchidBlush", 34, 152, 80, -12); R(g, "roseWine", 168, 166, 84, 8); R(g, "roseIvory2", 112, 128, 66, 6);
  R(g, "orchid", 88, 214, 132, 0); R(g, "roseIvory2", 194, 248, 84, -10);
  R(g, "roseBlush2", 22, 262, 84, 10); R(g, "roseWine", 128, 286, 62, -6);
  // hojitas delante para unir
  H(g, 150, 214, 46, -20); H(g, 60, 282, 44, 150); }
// Arreglo pequeño (arriba a la derecha): mismo estilo, nace de la esquina superior derecha
{ const g = sym("posy", "0 0 240 180");
  pampa(g, 240, 8, 20, 44, 120, "#d8c8aa"); pampa(g, 240, 12, 56, 112, 110, "#dfd1b6"); pampa(g, 236, 10, 132, 168, 96, "#d6c6a7");
  rama(g, 242, 4, 70, 26, 7); rama(g, 240, 10, 196, 178, 6);
  paniculata(g, 236, 10, 60, 70, 18, 14); paniculata(g, 236, 14, 110, 132, 16, 12); paniculata(g, 236, 14, 214, 150, 14, 11);
  H(g, 170, 56, 70, 160); H(g, 160, 64, 64, 120); H(g, 190, 70, 66, 80); H(g, 150, 46, 60, -170);
  use(g, "obud", 78, 66, 18, 26, { transform: "rotate(-110 87 79)" });
  R(g, "roseBlush2", 112, 46, 64, 10); R(g, "roseWine", 206, 98, 66, -8);
  R(g, "orchid", 166, 46, 102, 0); R(g, "roseIvory2", 232, 22, 62, 12);
  H(g, 130, 72, 40, 150); }
// Sello de cera vino con el monograma D&D
selloCera(sym("sealMono", "-100 -100 200 200"), 96, { escala: .68 });
window.listo = true;
</script></body></html>
