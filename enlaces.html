<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Enlaces de invitados</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tema.css?v=202611100900">
  <style>
    @media (prefers-color-scheme: dark) { html, body { background: var(--ivory); color: var(--ink); } }
    * { box-sizing: border-box; }
    body { font-family: var(--serif); font-variant-numeric: lining-nums; background: var(--ivory); color: var(--ink); margin: 0; padding: 24px 16px 40px; font-size: 17px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-family: var(--script); font-weight: normal; color: var(--wine); font-size: 50px; line-height: 1.2; margin: 0; text-align: center; }
    .sub { text-align: center; font-size: 16px; font-style: italic; color: var(--ink-soft); margin: 4px 0 6px; }
    .total { text-align: center; font-family: var(--caps); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; box-shadow: 0 18px 30px -26px var(--shadow); }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .name { font-family: var(--caps); font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: var(--wine); }
    .pases { font-size: 14px; background: var(--sage-light); color: #4f6049; padding: 2px 10px; border-radius: 20px; white-space: nowrap; }
    .mesa { font-size: 14px; background: #f3ead6; color: #7a5e2c; padding: 2px 10px; border-radius: 20px; white-space: nowrap; margin-left: 6px; }
    .who { font-size: 17px; margin-top: 6px; }
    .state { font-size: 15px; margin-top: 4px; color: var(--ink-soft); font-style: italic; }
    .state.yes { color: #4f6b49; }
    .state.no { color: #8a5a4a; }
    .url { font-size: 14px; color: var(--ink-soft); word-break: break-all; margin: 8px 0 10px; }
    .row { display: flex; gap: 8px; }
    .row a, .row button { flex: 1; text-align: center; padding: 9px; border-radius: 999px; font: inherit; font-size: 15px; cursor: pointer; text-decoration: none; }
    .copy { background: #fff; border: 1px solid var(--line); color: var(--wine); }
    .wa { background: #25d366; border: 1px solid #25d366; color: #fff; }
    .err { color: #a3272f; text-align: center; }
  </style>
</head>
<body class="pg-fondo">
  <div class="wrap">
    <img class="pg-logo" src="assets/logo-dd.webp" alt="" width="104" height="130">
    <h1>Enlaces de invitados</h1>
    <p class="sub">Esta lista sale de la pestaña <b>Lista de Invitados</b> de Google Sheets. Para añadir o cambiar invitados, edita esa pestaña y recarga esta página.</p>
    <img class="pg-flor" src="assets/separador.webp" alt="" width="300" height="108">
    <p class="total" id="total"></p>
    <div id="list"></div>
  </div>
  <script src="panel.js?v=202611100900"></script>
  <script>
    const base = new URL("./", location.href).href;
    Panel.cargarLista()
      .then((r) => {
        const guests = r.familias;
        const pasesDe = (g) => g.personas.reduce((s, p) => s + (p.pases || 1), 0);
        const totalPases = guests.reduce((s, g) => s + pasesDe(g), 0);
        document.getElementById("total").textContent = `${guests.length} invitaciones · ${totalPases} pases en total`;
        const list = document.getElementById("list");
        guests.forEach((g) => {
          const url = `${base}?i=${encodeURIComponent(g.codigo)}`;
          const n = pasesDe(g);
          const msg = `¡Hola ${g.familia}! 💌 Con mucha alegría te compartimos la invitación a nuestra boda (válida para ${n} ${n === 1 ? "persona" : "personas"}). Ábrela aquí:\n${url}`;
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="top"><span class="name"></span><span><span class="pases"></span><span class="mesa" hidden></span></span></div>
            <div class="who"></div>
            <div class="state"></div>
            <div class="url"></div>
            <div class="row"><button class="copy">Copiar enlace</button><a class="wa" target="_blank" rel="noopener">WhatsApp</a></div>`;
          card.querySelector(".name").textContent = g.familia;
          card.querySelector(".pases").textContent = `${n} ${n === 1 ? "pase" : "pases"}`;
          const mesas = [...new Set(g.personas.map((p) => p.mesa).filter(Boolean))];
          if (mesas.length) {
            const m = card.querySelector(".mesa");
            m.hidden = false;
            m.textContent = (mesas.length === 1 ? "Mesa " : "Mesas ") + mesas.join(", ");
          }
          card.querySelector(".who").textContent = g.personas.map((p) => p.nombre + (p.pases > 1 ? ` (+${p.pases - 1})` : "")).join(" · ");
          const c = g.confirmacion;
          const st = card.querySelector(".state");
          st.textContent = !c ? "⏳ Aún no responde" : c.asistencia === "Sí" ? `✓ Confirmó ${c.asistentes.length} de ${n}` : "✗ No podrá asistir";
          st.className = "state " + (!c ? "" : c.asistencia === "Sí" ? "yes" : "no");
          card.querySelector(".url").textContent = url;
          card.querySelector(".wa").href = "https://wa.me/?text=" + encodeURIComponent(msg);
          const btn = card.querySelector(".copy");
          btn.onclick = () => navigator.clipboard.writeText(url).then(() => { btn.textContent = "¡Copiado!"; setTimeout(() => btn.textContent = "Copiar enlace", 1500); });
          list.appendChild(card);
        });
      })
      .catch((err) => {
        const p = document.createElement("p");
        p.className = "err";
        p.textContent = err.message;
        document.getElementById("list").replaceChildren(p);
      });
  </script>
</body>
</html>
