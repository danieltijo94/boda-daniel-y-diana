<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="robots" content="noindex">
  <title>Enlaces de invitados</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: light dark; } body { background: #fbf6f1; color: #5a4448; } }
    body { font-family: Montserrat, sans-serif; background: #fbf6f1; color: #5a4448; margin: 0; padding: 24px 16px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-family: "Great Vibes", cursive; font-weight: normal; color: #a8646a; font-size: 44px; margin: 0; text-align: center; }
    .sub { text-align: center; font-size: 13px; color: #8a7074; margin: 4px 0 20px; }
    .total { text-align: center; font-size: 14px; margin-bottom: 18px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: 0 10px 24px -18px rgba(120,60,70,.6); }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .name { font-weight: 500; }
    .pases { font-size: 12px; background: #e9efe3; color: #6f8660; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
    .mesa { font-size: 12px; background: #f6e9d2; color: #8a6a2f; padding: 3px 10px; border-radius: 20px; white-space: nowrap; margin-left: 6px; }
    .who { font-size: 13px; color: #5a4448; margin-top: 6px; }
    .url { font-size: 12px; color: #8a7074; word-break: break-all; margin: 8px 0 10px; }
    .row { display: flex; gap: 8px; }
    .row a, .row button { flex: 1; text-align: center; padding: 10px; border-radius: 30px; border: 0; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
    .copy { background: #f3d9d3; color: #a8646a; }
    .wa { background: #25d366; color: #fff; }
    .err { color: #a8646a; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Enlaces de invitados</h1>
    <p class="sub">Esta lista sale del archivo <b>invitados.csv</b>. Para añadir o cambiar invitados, edita ese archivo.</p>
    <p class="total" id="total"></p>
    <div id="list"></div>
  </div>
  <script>
    function parseCSV(text) {
      const rows = text.replace(/^﻿/, "").split(/\r?\n/).filter((l) => l.trim());
      const split = (line) => {
        const out = []; let cur = ""; let q = false;
        for (const ch of line) {
          if (ch === '"') q = !q;
          else if ((ch === "," || ch === ";") && !q) { out.push(cur.trim()); cur = ""; }
          else cur += ch;
        }
        out.push(cur.trim()); return out;
      };
      const head = split(rows.shift()).map((h) => h.toLowerCase());
      return rows.map((r) => { const c = split(r); return Object.fromEntries(head.map((h, i) => [h, c[i] || ""])); });
    }
    const base = new URL("./", location.href).href;
    fetch("invitados.csv", { cache: "no-store" })
      .then((r) => r.text())
      .then((t) => {
        const guests = parseCSV(t).filter((g) => g.codigo);
        const count = (g) => (g.invitados || "").split("|").filter((n) => n.trim()).length || parseInt(g.pases, 10) || 1;
        const totalPases = guests.reduce((s, g) => s + count(g), 0);
        document.getElementById("total").textContent = `${guests.length} invitaciones · ${totalPases} pases en total`;
        const list = document.getElementById("list");
        guests.forEach((g) => {
          const url = `${base}?i=${encodeURIComponent(g.codigo)}`;
          const n = count(g);
          const msg = `¡Hola ${g.familia}! 💌 Con mucha alegría te compartimos la invitación a nuestra boda (válida para ${n} ${n === 1 ? "persona" : "personas"}). Ábrela aquí:\n${url}`;
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="top"><span class="name"></span><span><span class="pases"></span><span class="mesa" hidden></span></span></div>
            <div class="who"></div>
            <div class="url"></div>
            <div class="row"><button class="copy">Copiar enlace</button><a class="wa" target="_blank" rel="noopener">WhatsApp</a></div>`;
          card.querySelector(".name").textContent = g.familia;
          card.querySelector(".pases").textContent = `${n} ${n === 1 ? "pase" : "pases"}`;
          if ((g.mesa || "").trim()) { const m = card.querySelector(".mesa"); m.hidden = false; m.textContent = "Mesa " + g.mesa.trim(); }
          card.querySelector(".who").textContent = (g.invitados || "").split("|").map((x) => x.trim()).filter(Boolean).join(" · ");
          card.querySelector(".url").textContent = url;
          card.querySelector(".wa").href = "https://wa.me/?text=" + encodeURIComponent(msg);
          const btn = card.querySelector(".copy");
          btn.onclick = () => navigator.clipboard.writeText(url).then(() => { btn.textContent = "¡Copiado!"; setTimeout(() => btn.textContent = "Copiar enlace", 1500); });
          list.appendChild(card);
        });
      })
      .catch(() => { document.getElementById("list").innerHTML = '<p class="err">No se pudo leer invitados.csv</p>'; });
  </script>
</body>
</html>
